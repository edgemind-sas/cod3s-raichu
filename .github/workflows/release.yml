# Release wheels: the multi-platform build matrix (M5).
#
# Triggered by a version tag (`v*`) or manually. Builds one abi3 wheel per
# platform (a single wheel covers every CPython >= 3.9 on that platform)
# plus the source distribution, smoke-tests the natively-runnable ones,
# and attaches everything to the GitHub Release for the tag.
#
# Distribution channel note: artefacts stop at the GitHub Release on
# purpose: publishing to PyPI (or an internal index) is a separate,
# deliberate step, not wired here.

name: Release wheels

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Least privilege: only the release job writes to the repository. The build
# jobs run third-party actions and get a read-only token.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  wheels:
    name: Wheel ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { name: linux-x86_64, runner: ubuntu-latest, target: x86_64, native: true, manylinux: "2_28", extension: so }
          # aarch64 cross-compiles on the hosted runner; the smoke test is
          # skipped (the wheel cannot execute there).
          - { name: linux-aarch64, runner: ubuntu-latest, target: aarch64, native: false, manylinux: "2_28", extension: so }
          # macOS Intel (macos-13) dropped on 2026-09-02: hosted runners for
          # the retired Intel Mac line queue for many hours (the v0.9.0 run
          # sat 13 h in queue and was never scheduled). Intel Mac users build
          # the binding from source instead.
          - { name: macos-arm64, runner: macos-latest, target: aarch64, native: true, manylinux: auto, extension: dylib }
          - { name: windows-x86_64, runner: windows-latest, target: x64, native: true, manylinux: auto, extension: dll }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
        if: startsWith(matrix.platform.name, 'macos-') || startsWith(matrix.platform.name, 'windows-')
      - name: Build FMU runtime on macOS
        if: startsWith(matrix.platform.name, 'macos-')
        run: python scripts/build_fmu_runtime.py --target aarch64-apple-darwin --release
      - name: Build FMU runtime on Windows
        if: startsWith(matrix.platform.name, 'windows-')
        run: python scripts/build_fmu_runtime.py --target x86_64-pc-windows-msvc --release
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release -m bindings/pyraichu/Cargo.toml --out dist
          manylinux: ${{ matrix.platform.manylinux }}
          before-script-linux: |
            if command -v dnf >/dev/null; then
              dnf install -y clang-devel
            elif command -v apt-get >/dev/null; then
              apt-get update && apt-get install -y libclang-dev
            else
              echo "No package manager found for libclang" >&2
              exit 1
            fi
            if [ "${{ matrix.platform.target }}" = aarch64 ]; then
              cross_sysroot=$(/usr/aarch64-unknown-linux-gnu/bin/aarch64-unknown-linux-gnu-gcc -print-sysroot)
              export BINDGEN_EXTRA_CLANG_ARGS="--target=aarch64-unknown-linux-gnu --sysroot=$cross_sysroot"
            fi
            python scripts/build_fmu_runtime.py --target ${{ matrix.platform.target }}-unknown-linux-gnu --release
      - name: Smoke-test wheel and exported FMU
        if: matrix.platform.native
        shell: bash
        run: |
          pip install --no-index --find-links dist pyraichu
          python -c "import pyraichu; print(pyraichu.__version__)"
          pip install pytest fmpy
          python -m pytest python/tests/unit/test_program.py -q
          python scripts/smoke_fmu_wheel.py
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.platform.name }}
          path: dist/*.whl
      - name: Stage standalone runtime
        shell: bash
        run: |
          cp bindings/pyraichu/python/pyraichu/runtime/*/* \
            dist/raichu_fmu-${{ matrix.platform.name }}.${{ matrix.platform.extension }}
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-${{ matrix.platform.name }}
          path: dist/raichu_fmu-${{ matrix.platform.name }}.${{ matrix.platform.extension }}
          if-no-files-found: error

  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: -m bindings/pyraichu/Cargo.toml --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  release:
    name: Attach to the GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Upload artefacts to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Probe explicitly rather than falling back on any `create`
          # failure: an auth error, a malformed tag or an empty dist/ would
          # otherwise be read as "the release already exists" and resurface
          # as a second, less informative error from `upload`.
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" --clobber dist/*
          else
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              dist/*
          fi
