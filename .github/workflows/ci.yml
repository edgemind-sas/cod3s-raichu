name: CI

on:
  push:
    branches: ["master", "main", "feat/**", "fix/**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmu-export:
    name: FMI 3 export (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { name: linux-x86_64, runner: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
          - { name: linux-aarch64, runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { name: macos-arm64, runner: macos-latest, target: aarch64-apple-darwin }
          - { name: windows-x86_64, runner: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v4
      - name: Native Linux build prerequisites
        if: startsWith(matrix.platform.name, 'linux-')
        run: sudo apt-get update && sudo apt-get install -y libclang-dev cmake g++
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test tools
        run: python -m pip install maturin pytest fmpy==0.3.32
      - name: Build native FMU runtime and Python wheel
        run: |
          python scripts/build_fmu_runtime.py --target ${{ matrix.platform.target }} --release
          maturin build --release -m bindings/pyraichu/Cargo.toml --out dist
      - name: Install Python wheel
        shell: bash
        run: python -m pip install dist/pyraichu-*.whl
      - name: Install independent FMI validator
        shell: bash
        run: |
          if [[ "${{ matrix.platform.name }}" == linux-aarch64 ]]; then
            # The upstream 0.12.0 release has no Linux aarch64 binary.
            cargo install --git https://github.com/modelica/fmusim.git \
              --tag v0.12.0 --locked --path fmusim --root "$RUNNER_TEMP/fmusim"
            echo "RAICHU_FMUSIM=$RUNNER_TEMP/fmusim/bin/fmusim" >> "$GITHUB_ENV"
          else
            case "${{ matrix.platform.name }}" in
              linux-x86_64) asset=fmusim-x86_64-linux.zip; binary=fmusim ;;
              macos-arm64) asset=fmusim-aarch64-darwin.zip; binary=fmusim ;;
              windows-x86_64) asset=fmusim-x86_64-windows.zip; binary=fmusim.exe ;;
            esac
            mkdir -p .fmusim
            curl -fsSL "https://github.com/modelica/fmusim/releases/download/v0.12.0/$asset" -o .fmusim/fmusim.zip
            unzip -q .fmusim/fmusim.zip -d .fmusim
            chmod +x ".fmusim/$binary"
            validator="$PWD/.fmusim/$binary"
            if [[ "${{ matrix.platform.name }}" == windows-x86_64 ]]; then
              validator=$(cygpath -w "$validator")
            fi
            echo "RAICHU_FMUSIM=$validator" >> "$GITHUB_ENV"
          fi
      - name: Validate and execute exported FMUs under independent importers
        run: python -m pytest python/tests/unit/test_fmi_roundtrip.py -q

  fmi:
    name: FMI import (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: FMI host and integration tests
        run: cargo test -p raichu-fmi -p raichu-core -p raichu-explore

  rust:
    name: Rust (fmt, clippy, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: HiGHS build prerequisites
        run: sudo apt-get update && sudo apt-get install -y libclang-dev cmake g++
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy (warnings are errors)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace

  wheel:
    name: Python wheel (maturin)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: HiGHS build prerequisites
        run: sudo apt-get update && sudo apt-get install -y libclang-dev cmake g++
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build wheel
        run: |
          python scripts/build_fmu_runtime.py --target x86_64-unknown-linux-gnu --release
          pipx run maturin build -m bindings/pyraichu/Cargo.toml
      - name: Smoke-test import
        run: |
          pip install target/wheels/pyraichu-*.whl
          python -c "import pyraichu; print(pyraichu.__version__)"

  # RAICHU on its own: the engine through its binding, the muscadet
  # authoring layer, the declaration vocabulary and the plugins. No
  # PyCATSHOO, no recorded reference, so a failure here is an internal
  # regression and the whole suite answers in seconds.
  unit:
    name: Python unit suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: HiGHS build prerequisites
        run: sudo apt-get update && sudo apt-get install -y libclang-dev cmake g++
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build and install the wheel
        run: |
          python scripts/build_fmu_runtime.py --target x86_64-unknown-linux-gnu --release
          pipx run maturin build -m bindings/pyraichu/Cargo.toml
          pip install target/wheels/pyraichu-*.whl pytest
      - name: Run the unit suite
        run: pytest python/tests/unit -q

  docs:
    name: Docs examples + RAICHU-side benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: HiGHS build prerequisites
        run: sudo apt-get update && sudo apt-get install -y libclang-dev cmake g++
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build and install the wheel
        run: |
          python scripts/build_fmu_runtime.py --target x86_64-unknown-linux-gnu --release
          pipx run maturin build -m bindings/pyraichu/Cargo.toml
          pip install target/wheels/pyraichu-*.whl pytest
      # Executes every runnable code block in the documentation, guarding
      # the docs against engine drift (pyraichu-only; no PyCATSHOO).
      - name: Run documentation examples
        run: pytest python/tests/docs -q
      # Anti-regression smoke of the benchmark's RAICHU side (the
      # PyCATSHOO side needs a licensed install and runs locally).
      - name: RAICHU-side benchmark smoke
        run: python benchmarks/pycatshoo-cpp/run_bench.py --raichu-only

  # Cross-validation against PyCATSHOO needs a licensed PyCATSHOO install
  # (cod3s/muscadet oracle); it runs on a self-hosted/local environment.
  # Kept non-blocking until such a runner exists (M0 Phase 4 note).
  validation:
    name: Validation vs PyCATSHOO (placeholder)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Explain skip
        run: echo "PyCATSHOO oracle unavailable on hosted runners; run 'uv run pytest python/tests/validation' locally. What needs no oracle runs in the 'unit' job above."
